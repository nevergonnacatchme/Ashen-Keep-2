<style>

  #pad .tb { width:50px; height:50px; border-radius:12px; }
</style>

const B = { LEFT:1, RIGHT:2, UP:4, DOWN:8, JUMP:16, LIGHT:32, HEAVY:64, ROLL:128, PARRY:256, CAST:512, FLASK:1024, USE:2048,
            PAUSE:4096, SPELL:8192, OK:16384, BACK:32768, MAP:65536 };
const KEYMAP = {
  KeyA:B.LEFT, ArrowLeft:B.LEFT, KeyD:B.RIGHT, ArrowRight:B.RIGHT,
  KeyW:B.UP|B.JUMP, ArrowUp:B.UP|B.JUMP, KeyS:B.DOWN, ArrowDown:B.DOWN,
  Space:B.JUMP|B.OK, KeyJ:B.LIGHT, KeyK:B.HEAVY, KeyL:B.ROLL, ShiftLeft:B.ROLL, ShiftRight:B.ROLL,
  KeyI:B.PARRY, KeyU:B.CAST, KeyQ:B.SPELL, KeyF:B.FLASK, KeyE:B.USE|B.OK, Enter:B.OK, NumpadEnter:B.OK,
  Escape:B.PAUSE|B.BACK, Backspace:B.BACK, KeyP:B.PAUSE, KeyM:B.MAP, KeyO:B.PARRY, KeyH:B.CAST
};
let keyBits = 0, mouseBits = 0, touchBits = 0;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha:false });
const img = ctx.createImageData(640, 360);
let wasm = null, mem = null;

function showErr(e){ document.getElementById('err').textContent = String(e && e.stack || e); }

/* ---- storage ---- */
function b64enc(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function b64dec(s){ const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const env = {
  js_store(slot, ptr, len){ const u=new Uint8Array(mem.buffer, ptr, len); store.set('ashenkeep2_' + slot, b64enc(u)); },
  js_fetch(slot, ptr, max){ const s=store.get('ashenkeep2_' + slot); if(!s) return 0; const u=b64dec(s); const n=Math.min(u.length,max); new Uint8Array(mem.buffer, ptr, n).set(u.subarray(0,n)); return n; }
};

/* ---- audio ---- */
let actx = null, node = null;
function startAudio(){
  if (actx) { if (actx.state !== 'running') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC();
  return actx.sampleRate;
}
function hookAudio(){
  if (!actx || node || !wasm) return;
  node = actx.createScriptProcessor(2048, 0, 2);
  node.onaudioprocess = (ev) => {
    const L = ev.outputBuffer.getChannelData(0), R = ev.outputBuffer.getChannelData(1);
    const n = L.length;
    const ptr = wasm.ak_audio(n);
    const f = new Float32Array(mem.buffer, ptr, n*2);
    for (let i=0;i<n;i++){ L[i]=f[i*2]; R[i]=f[i*2+1]; }
  };
  node.connect(actx.destination);
}

/* ---- input ---- */
/* test cheat: type 6 6 6 during a boss fight and the boss falls (also window.akKillBoss() from the console) */
let cheatBuf='';
window.akKillBoss = () => wasm && wasm.ak_cheat ? !!wasm.ak_cheat(1) : false;
addEventListener('keydown', e => {
  if (/^(Digit|Numpad)[0-9]$/.test(e.code)){ cheatBuf=(cheatBuf+e.code.slice(-1)).slice(-3); if (cheatBuf==='666'){ cheatBuf=''; window.akKillBoss(); } }
});
addEventListener('keydown', e => { const b=KEYMAP[e.code]; if (b!==undefined){ keyBits|=b; e.preventDefault(); }
  if (e.code==='F11' || (e.code==='Enter' && e.altKey)) { e.preventDefault(); toggleFS(); } });
addEventListener('keyup', e => { const b=KEYMAP[e.code]; if (b!==undefined){ keyBits&=~b; e.preventDefault(); } });
addEventListener('blur', () => { keyBits=0; mouseBits=0; touchBits=0; });
canvas.addEventListener('mousedown', e => { mouseBits |= e.button===2 ? B.HEAVY : B.LIGHT; });
addEventListener('mouseup', e => { mouseBits &= ~(e.button===2 ? B.HEAVY : B.LIGHT); });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('dblclick', toggleFS);
function toggleFS(){ const d=document; if (!d.fullscreenElement) (d.documentElement.requestFullscreen||function(){}).call(d.documentElement); else d.exitFullscreen(); }

function padBits(){
  let b = 0;
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads){
    if (!p || !p.connected) continue;
    const btn = i => p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.5);
    if (btn(0)) b |= B.JUMP|B.OK;   if (btn(1)) b |= B.ROLL|B.BACK;
    if (btn(2)) b |= B.FLASK;       if (btn(3)) b |= B.USE|B.OK;
    if (btn(4)) b |= B.PARRY;       if (btn(5)) b |= B.LIGHT;
    if (btn(6)) b |= B.CAST;        if (btn(7)) b |= B.HEAVY;
    if (btn(8)) b |= B.SPELL;       if (btn(9)) b |= B.PAUSE;
    if (btn(10)||btn(11)) b |= B.SPELL;
    if (btn(12)) b |= B.UP;  if (btn(13)) b |= B.DOWN;
    if (btn(14)) b |= B.LEFT; if (btn(15)) b |= B.RIGHT;
    const ax = p.axes[0]||0, ay = p.axes[1]||0;
    if (ax < -0.4) b |= B.LEFT; if (ax > 0.4) b |= B.RIGHT;
    if (ay < -0.6) b |= B.UP;   if (ay > 0.6) b |= B.DOWN;
  }
  return b;
}

/* touch: big buttons on the right, a pad on the left */
const TOUCH_BTNS = [
  ['ATK',  B.LIGHT,  92, 92, 62], ['HVY', B.HEAVY, 170, 64, 50], ['JUMP', B.JUMP|B.OK, 30, 30, 58],
  ['ROLL', B.ROLL|B.BACK, 100, 18, 50], ['PARRY', B.PARRY, 164, 128, 46], ['CAST', B.CAST, 226, 104, 44],
  ['FLASK', B.FLASK, 236, 40, 42], ['USE', B.USE|B.OK, 30, 112, 44], ['SPELL', B.SPELL, 290, 60, 38]
];
function buildTouch(){
  const t = document.getElementById('touch');
  for (const [label, bits, r, bt, size] of TOUCH_BTNS){
    const d = document.createElement('div'); d.className='tb'; d.textContent=label; d.dataset.b=bits;
    d.style.width=size+'px'; d.style.height=size+'px';
    d.style.right=`calc(${r}px + env(safe-area-inset-right))`; d.style.bottom=`calc(${bt}px + env(safe-area-inset-bottom))`;
    t.appendChild(d);
  }
  const pause = document.createElement('div'); pause.className='tb'; pause.textContent='II'; pause.dataset.b=B.PAUSE|B.BACK;
  pause.style.cssText='width:40px;height:40px;right:calc(14px + env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));border-radius:10px';
  t.appendChild(pause);
  const active = new Map();
  const update = () => { let b=0; for (const el of active.values()) if (el) b |= (+el.dataset.b); touchBits=b;
    document.querySelectorAll('#touch .tb').forEach(el => el.classList.toggle('down', [...active.values()].includes(el))); };
  const hit = (x,y) => { const el=document.elementFromPoint(x,y); return el && el.classList && el.classList.contains('tb') ? el : null; };
  const onTouch = e => { e.preventDefault(); active.clear(); for (const tt of e.touches) active.set(tt.identifier, hit(tt.clientX, tt.clientY)); update(); };
  ['touchstart','touchmove','touchend','touchcancel'].forEach(n => t.addEventListener(n, onTouch, {passive:false}));
  t.classList.add('on');
}

/* ---- layout: integer scaling when it fits ---- */
function fit(){
  const W=innerWidth, H=innerHeight;
  let s = Math.min(W/640, H/360);
  if (s >= 2) s = Math.floor(s);
  canvas.style.width = Math.floor(640*s)+'px'; canvas.style.height = Math.floor(360*s)+'px';
}
addEventListener('resize', fit); fit();

/* ---- boot ---- */
async function boot(){
  const rate = startAudio() || 48000;
  const bytes = b64dec(WASM_B64);
  const { instance } = await WebAssembly.instantiate(bytes, { env });
  wasm = instance.exports; mem = wasm.memory;
  wasm.ak_init(rate);
  hookAudio();
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) buildTouch();
  let last = performance.now(), acc = 0;
  const STEP = 1000/60;
  function frame(now){
    acc += Math.min(now - last, 250); last = now;
    const bits = keyBits | mouseBits | touchBits | padBits();
    let steps = 0;
    while (acc >= STEP && steps < 5){ wasm.ak_tick(bits); acc -= STEP; steps++; }
    if (steps === 5) acc = 0;
    const ptr = wasm.ak_render();
    img.data.set(new Uint8ClampedArray(mem.buffer, ptr, 640*360*4));
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
/* start straight on the title menu; browsers only allow sound after the first
   key press, click or tap, so the audio is switched on then */
function unlockAudio(){ startAudio(); hookAudio(); }
['pointerdown','keydown','touchstart'].forEach(n => addEventListener(n, unlockAudio, {passive:true}));
boot().catch(showErr);
</script>
